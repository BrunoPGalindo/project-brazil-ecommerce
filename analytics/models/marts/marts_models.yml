version: 2

models:
  - name: fct_pedidos
    description: "Fact table containing order summaries, total payment amounts, and customer locations."
    columns:
      - name: order_id
        description: "Unique identifier for each order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to the customers dimension table."
        tests:
          - not_null
          - relationships:
              to: ref('dim_clientes')
              field: customer_id

  - name: fct_itens_pedidos
    description: "Fact table detailed by order item, including product prices, freight values, and seller locations."
    columns:
      - name: order_id
        description: "Identifier of the order associated with the item."
        tests:
          - not_null
      - name: seller_id
        description: "Foreign key to the sellers dimension table."
        tests:
          - relationships:
              to: ref('dim_vendedores')
              field: seller_id

  - name: dim_produtos
    description: "Dimension table for products, including category names and translated English categories."
    columns:
      - name: product_id
        description: "Unique identifier for each product."
        tests:
          - unique
          - not_null

  - name: dim_clientes
    description: "Dimension table containing unique customer identifiers and their geographic location."
    columns:
      - name: customer_id
        description: "Unique identifier for the customer record."
        tests:
          - unique
          - not_null

  - name: dim_vendedores
    description: "Dimension table containing seller identifiers and their respective city and state."
    columns:
      - name: seller_id
        description: "Unique identifier for each seller."
        tests:
          - unique
          - not_null

  - name: fct_avaliacoes
    description: "Fact table containing customer satisfaction scores (NPS) and review dates for each order."
    columns:
      - name: review_id
        description: "Unique identifier for each customer review."
        tests:
          - unique
          - not_null