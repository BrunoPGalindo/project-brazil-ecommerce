version: 2

models:
  - name: stg_pedidos
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

  - name: stg_vendedores
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
  
  - name: stg_itens_pedidos
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_item_id
        tests:
          - not_null
  - name: stg_clientes
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: stg_produtos
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_pagamentos
    columns:
      - name: order_id
        tests:
          - not_null

  - name: stg_avaliacoes_pedidos
    columns:
      - name: review_id
        tests:
          - unique
          - not_null